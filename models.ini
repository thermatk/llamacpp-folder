[DeepSeek-OCR]
temp = 0.0
#chat-template = deepseek-ocr
flash-attn = off


#https://about.nuextract.ai/blog/nuextract-3-release
#https://huggingface.co/collections/numind/nuextract3
#https://huggingface.co/numind/NuExtract3-GGUF
[NuExtract3]
#top-k = 20
#min-p = 0.0
#top-p = 0.95
temp = 0.6
#For Markdown OCR, use mode="markdown" or mode="content" without a template.
chat-template-kwargs = {"mode": "markdown","enable_thinking": true}
image-min-tokens = 2048 
image-max-tokens = 2048
ub = 2048
b = 2048
#spec-type = draft-mtp
#spec-draft-n-max = 2

#https://huggingface.co/prithivMLmods/chandra-ocr-2-GGUF
#https://huggingface.co/datalab-to/chandra-ocr-2/tree/main
#https://github.com/datalab-to/chandra
#https://huggingface.co/dougvk/chandra-ocr-2-BF16-GGUF-RDNA4
[chandra-ocr-2]
#top-p = 0.1
#temp = 0.0
image-min-tokens = 2048 
image-max-tokens = 2048
ub = 2048
b = 2048

#https://huggingface.co/infly/Infinity-Parser2-Pro

##### EMBEDDING #####

#https://huggingface.co/gpustack/bge-m3-GGUF
#https://huggingface.co/BAAI/bge-m3
[bge-m3]
ctx-size = 8192
embeddings = true

